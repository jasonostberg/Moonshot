<div id="root"></div>
<script>
const P={night:'#0d0f2b',ink:'#171b4a',moon:'#f4e8c1',lamp:'#ffb23e',hit:'#ff4d6d',grass:'#1d4a3c',dirt:'#7a6544',dim:'#a9acd6'};
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
// a blocky player like the ones in the game; origin at the hips, facing right
function figure(x,y,s,rot,body,dark,pose){
  const leg=(a,k)=>'<g transform="rotate('+a+')"><rect x="-9" y="0" width="18" height="'+(k||62)+'" rx="3" fill="'+dark+'"/><rect x="-11" y="'+((k||62)-4)+'" width="34" height="16" rx="4" fill="'+P.moon+'"/></g>';
  const arm=(a)=>'<g transform="translate(0,-62) rotate('+a+')"><rect x="-8" y="0" width="16" height="46" rx="3" fill="'+body+'"/></g>';
  const p=pose==='kick'?{l1:8,l2:-78,a1:40,a2:-50}:pose==='fly'?{l1:55,l2:-40,a1:150,a2:-140}:{l1:6,l2:-6,a1:10,a2:-10};
  return '<g transform="translate('+x+','+y+') scale('+s+') rotate('+rot+')">'
    +arm(p.a1)+leg(p.l1)
    +'<rect x="-24" y="-70" width="48" height="62" rx="5" fill="'+body+'"/>'
    +'<rect x="-22" y="-12" width="44" height="24" rx="4" fill="'+dark+'"/>'
    +'<circle cx="0" cy="-90" r="19" fill="#f0c9a0"/>'
    +(pose==='fly'?'<circle cx="10" cy="2" r="11" fill="'+P.moon+'"/><circle cx="10" cy="2" r="6" fill="'+P.hit+'"/>':'')
    +leg(p.l2)+arm(p.a2)+'</g>';
}
function burst(x,y,r){let s='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r1=r*(i%2?0.55:1);s+=(i?'L':'M')+(x+Math.cos(a)*r1).toFixed(1)+' '+(y+Math.sin(a)*r1).toFixed(1)}
  return '<path d="'+s+'Z" fill="'+P.lamp+'"/><path d="'+s+'Z" fill="'+P.hit+'" transform="translate('+x+','+y+') scale(.6) translate('+(-x)+','+(-y)+')"/>'}
function moon(cx,cy,r,seed){const rnd=rng(seed);let c='';for(let i=0;i<16;i++){const a=rnd()*6.28,d=Math.sqrt(rnd())*r*0.8,cr=r*(0.05+rnd()*0.13);c+='<circle cx="'+(cx+Math.cos(a)*d)+'" cy="'+(cy+Math.sin(a)*d)+'" r="'+cr+'" fill="#b9ad8a" opacity="'+(0.35+rnd()*0.4)+'"/>'}
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r*1.35+'" fill="'+P.moon+'" opacity=".07"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r*1.15+'" fill="'+P.moon+'" opacity=".1"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+P.moon+'"/><clipPath id="mc'+seed+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath><g clip-path="url(#mc'+seed+')">'+c+'</g>'}
function stars(w,h,n,seed){const rnd=rng(seed);let s='';for(let i=0;i<n;i++){s+='<circle cx="'+(rnd()*w).toFixed(0)+'" cy="'+(rnd()*h).toFixed(0)+'" r="'+(0.8+rnd()*2.2).toFixed(1)+'" fill="'+P.moon+'" opacity="'+(0.4+rnd()*0.6).toFixed(2)+'"/>'}return s}
function lampPost(x,y,h){return '<rect x="'+(x-4)+'" y="'+(y-h)+'" width="8" height="'+h+'" fill="#2a2f66"/><circle cx="'+x+'" cy="'+(y-h)+'" r="34" fill="'+P.lamp+'" opacity=".16"/><circle cx="'+x+'" cy="'+(y-h)+'" r="13" fill="'+P.lamp+'"/>'}
function title(x,y,size,anchor,two){const t=(txt,yy)=>'<text x="'+(x+size*0.07)+'" y="'+(yy+size*0.07)+'" font-family="Bowlby" font-size="'+size+'" text-anchor="'+anchor+'" fill="'+P.hit+'">'+txt+'</text><text x="'+x+'" y="'+yy+'" font-family="Bowlby" font-size="'+size+'" text-anchor="'+anchor+'" fill="'+P.moon+'">'+txt+'</text>';
  return two?t('MOONSHOT',y)+t('NUTCRACKER',y+size*0.98):t('MOONSHOT NUTCRACKER',y)}
function tag(x,y,size,anchor){return '<text x="'+x+'" y="'+y+'" font-family="Rubik" font-weight="700" font-size="'+size+'" text-anchor="'+anchor+'" fill="'+P.lamp+'" letter-spacing="'+size*0.12+'">KICK FIRST. FLY LATER.</text>'}
function trail(x0,y0,x1,y1,cx,cy,n){let s='';for(let i=1;i<n;i++){const t=i/n,u=1-t;const x=u*u*x0+2*u*t*cx+t*t*x1,y=u*u*y0+2*u*t*cy+t*t*y1;s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(3+t*5).toFixed(1)+'" fill="'+P.moon+'" opacity="'+(0.25+t*0.55).toFixed(2)+'"/>'}return s}
function sky(w,h,gy){return '<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080920"/><stop offset=".75" stop-color="#171b4a"/><stop offset="1" stop-color="#2a2f66"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#sk)"/>'+stars(w,gy,Math.round(w*gy/5200),7)}
function ground(w,h,gy){return '<rect x="0" y="'+gy+'" width="'+w+'" height="'+(h-gy)+'" fill="'+P.grass+'"/><ellipse cx="'+w/2+'" cy="'+(gy+(h-gy)*0.62)+'" rx="'+w*0.62+'" ry="'+(h-gy)*0.6+'" fill="'+P.dirt+'"/><ellipse cx="'+w/2+'" cy="'+(gy+(h-gy)*0.62)+'" rx="'+w*0.62+'" ry="'+(h-gy)*0.6+'" fill="none" stroke="'+P.moon+'" stroke-width="5" opacity=".8"/>'}
const A={
 capsule(){const w=600,h=900,gy=660;return [w,h,sky(w,h,gy)+moon(385,235,170,3)+burst(300,130,58)
   +lampPost(60,gy+10,210)+lampPost(548,gy+10,160)+ground(w,h,gy)
   +trail(400,560,330,250,210,400,9)+figure(215,390,1.15,-125,'#2bb3a3','#17695f','fly')
   +figure(400,640,1.2,0,P.hit,'#a02b45','kick')
   +title(300,812,62,'middle',true)]},
 header(){const w=920,h=430,gy=345;return [w,h,sky(w,h,gy)+moon(740,150,118,3)+burst(815,75,38)
   +lampPost(885,gy+6,120)+ground(w,h,gy)
   +trail(600,290,690,170,590,200,6)+figure(668,170,0.72,-118,'#2bb3a3','#17695f','fly')
   +figure(560,338,0.8,0,P.hit,'#a02b45','kick')
   +title(40,140,60,'start',true)+tag(43,250,17,'start')]},
 hero(){const w=1920,h=620,gy=500;return [w,h,sky(w,h,gy)+moon(1500,230,190,3)+burst(1370,130,62)
   +lampPost(120,gy+8,200)+lampPost(520,gy+8,150)+lampPost(1840,gy+8,180)+ground(w,h,gy)
   +trail(1130,430,1360,170,1130,160,10)+figure(1190,260,1.0,-115,'#2bb3a3','#17695f','fly')
   +figure(1080,500,1.25,0,P.hit,'#a02b45','kick')+figure(800,505,1.05,0,P.lamp,'#a8701f','stand')]},
 logo(){const w=1100,h=300;return [w,h,title(550,120,104,'middle',true)+tag(550,285,26,'middle')]},
 icon(){const w=256,h=256;return [w,h,'<rect width="256" height="256" rx="48" fill="'+P.night+'"/>'+stars(256,256,22,5)+moon(150,104,74,3)+burst(96,60,28)
   +figure(92,196,0.62,0,P.hit,'#a02b45','kick')]}
};
function show(name){const [w,h,body]=A[name]();document.getElementById('root').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>';return [w,h]}
</script>
